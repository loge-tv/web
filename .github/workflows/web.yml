name: Web app

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The TMDB proxy's builds' token (X-Client-Token), from the repository secret. It ends up in
      # the page's code anyway; pull requests from forks get no secrets and build without it.
      - run: npm run build
        env:
          VITE_TMDB_PROXY_TOKEN: ${{ secrets.VITE_TMDB_PROXY_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: loge-web
          path: dist
          retention-days: 14
